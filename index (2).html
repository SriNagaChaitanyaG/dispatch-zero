<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
</head>
<body>
<title>Dispatch Zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;600&family=Sora:wght@400;500;600&display=swap">
<style>
/* Dispatch Zero — single committed look: neon night control room.
   Layout: fixed background, one 500px column, sticky HUD, fixed bottom nav,
   one screen at a time inside #view. */
:root{
 --bg:#05080f;--p0:#080e1a;--p1:#0b1322;--p2:#13223a;--ln:#1e3152;--ln2:#2b4571;
 --tx:#e9f2ff;--mu:#8aa0c2;--dim:#5d7399;
 --cy:#22e4ff;--mg:#ff3d9a;--lm:#b6ff3b;--am:#ffb02e;--rd:#ff4a5c;--vi:#9d7bff;
 --acc:#22e4ff;--acc2:#ff3d9a;
 --nav:76px;
 color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.55 Sora,system-ui,-apple-system,sans-serif;overflow-x:hidden;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:left;touch-action:manipulation}
input,textarea{font:inherit}
h1,h2,h3,h4{font-family:'Chakra Petch',system-ui,sans-serif;margin:0;line-height:1.14;text-wrap:balance}
p{margin:0}

/* ---- background ---- */
#bg{position:fixed;inset:0;z-index:-2;pointer-events:none;background:
 radial-gradient(900px 620px at 88% -8%,color-mix(in srgb,var(--acc2) 16%,transparent),transparent 68%),
 radial-gradient(760px 560px at -10% 108%,color-mix(in srgb,var(--acc) 15%,transparent),transparent 70%),
 linear-gradient(170deg,#070c17,#04070e 60%,#05080f);transition:background .8s}
#bg::after{content:"";position:absolute;inset:-40%;background-image:
 linear-gradient(color-mix(in srgb,var(--acc) 7%,transparent) 1px,transparent 1px),
 linear-gradient(90deg,color-mix(in srgb,var(--acc) 7%,transparent) 1px,transparent 1px);
 background-size:38px 38px;transform:perspective(420px) rotateX(58deg);
 mask-image:linear-gradient(transparent 38%,#000 72%,transparent);animation:drift 11s linear infinite}
@keyframes drift{to{background-position:0 38px}}
#scan{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.35;
 background:repeating-linear-gradient(transparent 0 3px,rgba(0,0,0,.26) 3px 4px)}

/* ---- in-app browser notice ---- */
#iab{position:relative;z-index:40;display:flex;align-items:flex-start;gap:10px;
 padding:9px 14px;padding-top:calc(9px + env(safe-area-inset-top,0px));
 background:var(--am);color:#1a1200;font:600 12.5px/1.4 Sora,system-ui,sans-serif}
#iab span{flex:1}
#iab b{font-weight:800}
#iab button{flex:none;font-size:15px;line-height:1.3;opacity:.7;padding:2px 4px}

/* ---- frame ---- */
#cab{max-width:500px;margin:0 auto;padding-inline:16px;padding-bottom:calc(var(--nav) + 26px)}
#hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:8px;padding:10px 0 12px;
 background:linear-gradient(var(--bg) 62%,color-mix(in srgb,var(--bg) 70%,transparent) 86%,transparent)}
#hud[hidden],#nav[hidden]{display:none}
.rk{flex:1;min-width:0;display:grid;gap:4px}
.rk b{font:700 12px/1 'Chakra Petch',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.rk .sub{font:600 10px/1.2 'JetBrains Mono',monospace;color:var(--mu);display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden}
.rk .sub .dim{overflow:hidden;text-overflow:ellipsis}
.bar{height:5px;background:#070d18;box-shadow:inset 0 0 0 1px var(--ln);overflow:hidden;border-radius:3px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--lm));box-shadow:0 0 10px var(--acc);transition:width .7s cubic-bezier(.2,.8,.3,1)}
.chip2{display:flex;align-items:center;gap:4px;height:34px;padding:0 10px;background:var(--p1);box-shadow:inset 0 0 0 1px var(--ln);font:700 13px 'Chakra Petch',sans-serif;color:var(--am);border-radius:3px}
.ib{width:36px;height:34px;display:grid;place-items:center;background:var(--p1);box-shadow:inset 0 0 0 1px var(--ln);color:var(--mu);border-radius:3px;transition:.15s}
.ib.on{color:var(--acc);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 55%,transparent)}
.ib:active{transform:scale(.93)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}

/* ---- bottom nav ---- */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;
 padding:0 12px calc(10px + env(safe-area-inset-bottom,0px));
 background:linear-gradient(transparent,var(--bg) 42%)}
#nav .inner{width:100%;max-width:468px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;
 background:color-mix(in srgb,var(--p1) 92%,transparent);backdrop-filter:blur(14px);
 box-shadow:inset 0 0 0 1px var(--ln),0 -6px 26px rgba(0,0,0,.5);border-radius:5px}
#nav button{display:grid;justify-items:center;gap:3px;padding:8px 2px 6px;color:var(--dim);border-radius:4px;transition:.18s}
#nav button span{font:700 9.5px 'Chakra Petch',sans-serif;letter-spacing:.12em;text-transform:uppercase}
#nav button.on{color:var(--acc);background:color-mix(in srgb,var(--acc) 11%,transparent)}
#nav button.on svg{filter:drop-shadow(0 0 7px var(--acc))}
#nav button:active{transform:scale(.94)}
#nav .dotn{position:absolute;top:5px;right:calc(50% - 16px);width:7px;height:7px;background:var(--mg);border-radius:50%;box-shadow:0 0 8px var(--mg)}

/* ---- screens & shared ---- */
.scr{animation:in .32s cubic-bezier(.2,.8,.3,1) both;display:grid;gap:14px;align-content:start}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.99)}}
.mu{color:var(--mu)}.sm{font-size:12.5px}.dim{color:var(--dim)}
.sec{font:700 11px 'Chakra Petch',sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--mu);display:flex;align-items:center;gap:6px}
.pnl{background:linear-gradient(162deg,var(--p2),var(--p1) 70%);padding:16px;
 clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));
 box-shadow:inset 0 1px 0 color-mix(in srgb,var(--acc) 34%,transparent),inset 0 0 0 1px rgba(80,120,190,.17)}
.pnl.flat{clip-path:none;border-radius:4px}
.btn{font:700 15px 'Chakra Petch',sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:15px 20px;text-align:center;
 color:#02121a;background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 45%,#ffffff));
 clip-path:polygon(0 0,calc(100% - 11px) 0,100% 11px,100% 100%,11px 100%,0 calc(100% - 11px));
 box-shadow:0 0 24px color-mix(in srgb,var(--acc) 42%,transparent);transition:transform .1s;width:100%;display:block}
.btn:active{transform:scale(.975)}
.btn.alt{background:var(--p2);color:var(--acc);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 62%,transparent)}
.btn.gh{background:transparent;color:var(--mu);box-shadow:inset 0 0 0 1px var(--ln)}
.btn.big{padding:18px;font-size:17px}
.btn.sm2{padding:11px 14px;font-size:13px}
.btn[disabled]{opacity:.32;box-shadow:none;filter:grayscale(.7);pointer-events:none}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inf{display:inline-grid;place-items:center;width:15px;height:15px;flex:none;border-radius:50%;
 background:color-mix(in srgb,var(--acc) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 55%,transparent);
 color:var(--acc);font:700 9.5px 'Chakra Petch',sans-serif;padding:0;justify-content:center}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:3px;font:700 10.5px 'Chakra Petch',sans-serif;letter-spacing:.1em;text-transform:uppercase}
.pill.c{background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 40%,transparent)}
.pill.g{background:rgba(182,255,59,.14);color:var(--lm);box-shadow:inset 0 0 0 1px rgba(182,255,59,.4)}
.pill.a{background:rgba(255,176,46,.14);color:var(--am);box-shadow:inset 0 0 0 1px rgba(255,176,46,.4)}

/* ---- title ---- */
.title{display:grid;gap:18px;justify-items:center;text-align:center;padding-top:14px}
.sky{width:calc(100% + 32px);margin-inline:-16px;height:196px;overflow:hidden;mask-image:linear-gradient(#000 64%,transparent)}
.sky svg,.scene svg{width:100%;height:100%;display:block}
.logo{font-size:clamp(44px,15.5vw,66px);letter-spacing:.055em;font-weight:700;line-height:.94;
 text-shadow:0 0 30px color-mix(in srgb,var(--cy) 55%,transparent);animation:gl 6s infinite}
@keyframes gl{0%,93%,100%{transform:none;text-shadow:0 0 30px rgba(34,228,255,.55)}
 94%{transform:translateX(-4px);text-shadow:4px 0 var(--mg),-4px 0 var(--cy)}
 96%{transform:translateX(3px);text-shadow:-4px 0 var(--mg),4px 0 var(--cy)}}
.nk{width:100%;padding:15px;background:#050b16;color:var(--cy);border:0;outline:none;border-radius:3px;
 box-shadow:inset 0 0 0 1px var(--cy);font:600 19px 'Chakra Petch',sans-serif;text-align:center}
.nk::placeholder{color:#3f5f84}

/* ---- home ---- */
.hero{position:relative;overflow:hidden;padding:0}
.hero .scene{height:132px;pointer-events:none}
.hero .cap{padding:13px 16px 16px;display:flex;gap:14px;align-items:center;justify-content:space-between}
.ring{flex:none;width:58px;height:58px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 13px 'Chakra Petch',sans-serif}
.nextc{position:relative;padding:0;overflow:hidden;background:linear-gradient(140deg,color-mix(in srgb,var(--acc) 17%,var(--p2)),var(--p1));
 box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 45%,transparent),0 0 30px color-mix(in srgb,var(--acc) 17%,transparent)}
.nextc .top{display:flex;align-items:center;gap:10px;padding:14px 16px 0}
.nextc .bd{padding:8px 16px 16px;display:grid;gap:10px}
.nextc h3{font-size:21px}
.nextc .mv{pointer-events:none;position:absolute;right:-14px;top:-14px;width:112px;height:112px;opacity:.2}
.track{display:grid;gap:9px}
.node{display:flex;align-items:center;gap:13px;width:100%;padding:13px 14px;position:relative;
 background:linear-gradient(162deg,var(--p2),var(--p1) 80%);border-radius:4px;box-shadow:inset 0 0 0 1px var(--ln);transition:.18s}
.node:active{transform:scale(.985)}
.node .ico{flex:none;width:36px;height:36px;display:grid;place-items:center;font:700 15px 'Chakra Petch',sans-serif;
 background:#070e1a;box-shadow:inset 0 0 0 1px var(--ln);border-radius:4px;color:var(--mu)}
.node .nt{flex:1;min-width:0}
.node b{display:block;font:600 15px 'Chakra Petch',sans-serif;overflow-wrap:anywhere}
.node small{display:block;color:var(--mu);font-size:11.5px;line-height:1.35}
.node.done .ico{background:var(--lm);color:#08140a;box-shadow:none}
.node.done b{color:var(--mu)}
.node.lock{opacity:.44}
.node.next{box-shadow:inset 0 0 0 1px var(--acc),0 0 20px color-mix(in srgb,var(--acc) 24%,transparent)}
.node.next .ico{background:var(--acc);color:#02121a;box-shadow:none}
.node.bossn{box-shadow:inset 0 0 0 1px var(--mg)}
.node.bossn .ico{color:var(--mg)}
.node .st{flex:none;display:flex;gap:2px}
.node .st i{width:9px;height:9px;background:#13203a;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.node .st i.on{background:var(--am);box-shadow:0 0 5px var(--am)}

/* ---- map ---- */
.path{display:grid;gap:16px;position:relative}
.path::before{content:"";position:absolute;left:34px;top:16px;bottom:16px;width:2px;
 background:repeating-linear-gradient(var(--ln2) 0 7px,transparent 7px 15px)}
.lv{position:relative;display:flex;gap:14px;align-items:center;width:100%}
.lv .orb{flex:none;width:68px;height:68px;display:grid;place-items:center;font:700 22px 'Chakra Petch',sans-serif;
 background:var(--p2);box-shadow:inset 0 0 0 2px var(--ln);color:var(--mu);
 clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.lv.open .orb{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#02121a;box-shadow:0 0 22px color-mix(in srgb,var(--acc) 55%,transparent);animation:pulse 2.4s infinite}
.lv.clear .orb{background:linear-gradient(135deg,var(--lm),#6fd800);color:#08140a;box-shadow:0 0 18px rgba(182,255,59,.5)}
.lv b{display:block;font:600 16px 'Chakra Petch',sans-serif}
.lv small{display:block;color:var(--mu);font-size:12px;line-height:1.35}
.lv small+small{margin-top:1px}
.lv.lock{opacity:.46}
@keyframes pulse{50%{box-shadow:0 0 36px color-mix(in srgb,var(--acc) 75%,transparent)}}

/* ---- story ---- */
.story{display:grid;gap:12px}
.scene{position:relative;height:208px;overflow:hidden;background:linear-gradient(#0d1030,#08131f);
 clip-path:polygon(0 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%)}
.av{position:absolute;left:50%;bottom:8px;width:126px;height:126px;transform:translateX(-50%);
 filter:drop-shadow(0 0 18px var(--acc));animation:float 3.2s ease-in-out infinite}
.av.ph{filter:drop-shadow(0 0 18px var(--mg));animation:jit 1.1s steps(2) infinite}
.av svg{width:100%;height:100%}
@keyframes float{50%{transform:translate(-50%,-7px)}}
@keyframes jit{0%,100%{transform:translate(-50%,0)}50%{transform:translate(calc(-50% + 3px),-4px)}}
.skip{position:absolute;top:8px;right:8px;z-index:3;font:700 10.5px 'Chakra Petch',sans-serif;letter-spacing:.14em;
 color:var(--mu);padding:7px 11px;background:rgba(5,8,15,.72);border-radius:3px;box-shadow:inset 0 0 0 1px var(--ln)}
.dlg{min-height:142px;position:relative}
.who{font:700 12px 'Chakra Petch',sans-serif;letter-spacing:.2em;color:var(--acc);margin-bottom:7px}
.dlg p{font-size:16.5px}
.dlg.ph .who{color:var(--mg)}
.dlg.ph p{font-family:'JetBrains Mono',monospace;color:#ffb8d9;font-size:15px}
.more{position:absolute;right:14px;bottom:10px;font:600 10.5px 'JetBrains Mono',monospace;color:var(--acc);animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.18}}

/* ---- code ---- */
.code{margin:0;padding:13px;background:#030810;box-shadow:inset 0 0 0 1px var(--ln);border-radius:4px;
 font:600 12.5px/1.68 'JetBrains Mono',monospace;overflow-x:auto;white-space:pre;color:#cfe0ff;max-width:100%}
.code .c{color:#56688c}.code .s{color:var(--lm)}.code .n{color:var(--am)}.code .k{color:var(--mg)}.code .t{color:var(--cy)}
.con{padding:12px;background:#01050c;box-shadow:inset 0 0 0 1px #11331f;border-radius:4px;
 font:600 12.5px/1.65 'JetBrains Mono',monospace;color:var(--lm);min-height:44px}
.con div{animation:in .22s both}.con .pr{color:var(--dim)}

/* ---- teach ---- */
.teach ul{margin:0;padding-left:19px;display:grid;gap:9px}
.teach li::marker{color:var(--acc)}
.rule{padding:12px 14px;border-left:3px solid var(--am);background:rgba(255,176,46,.08);font-size:14px;border-radius:0 4px 4px 0}
.rule b{color:var(--am);font:700 10.5px 'Chakra Petch',sans-serif;letter-spacing:.17em;display:block;margin-bottom:3px}
.rule.c{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 8%,transparent)}
.rule.c b{color:var(--acc)}

/* ---- task bar ---- */
.qh{display:flex;align-items:center;gap:11px}
.x{width:34px;height:34px;flex:none;display:grid;place-items:center;background:var(--p1);box-shadow:inset 0 0 0 1px var(--ln);color:var(--mu);border-radius:3px}
.pg{flex:1;height:5px;background:#070d18;box-shadow:inset 0 0 0 1px var(--ln);border-radius:3px;overflow:hidden}
.pg i{display:block;height:100%;width:0;background:var(--acc);box-shadow:0 0 8px var(--acc);transition:width .45s}
.pcount{font:600 11.5px 'JetBrains Mono',monospace;color:var(--mu);flex:none}
.qt{font:700 11px 'Chakra Petch',sans-serif;letter-spacing:.2em;color:var(--mg)}
.qq{font-size:19px}
.qc{display:grid;gap:12px}

/* choose */
.opt{display:flex;gap:12px;align-items:center;width:100%;padding:13px 14px;background:var(--p1);
 box-shadow:inset 0 0 0 1px var(--ln);border-radius:4px;transition:.14s}
.opt:active{transform:scale(.982)}
.opt .l{flex:none;width:25px;height:25px;display:grid;place-items:center;font:700 12.5px 'Chakra Petch',sans-serif;background:#070e1a;color:var(--acc);border-radius:3px}
.opt span:last-child{min-width:0;overflow-wrap:anywhere}
.opt.mono span:last-child{font:600 12.5px 'JetBrains Mono',monospace}
.opt.ok{background:rgba(182,255,59,.13);box-shadow:inset 0 0 0 2px var(--lm)}
.opt.no{background:rgba(255,74,92,.13);box-shadow:inset 0 0 0 2px var(--rd)}
.opt.dim{opacity:.45}

/* fix */
.bug{display:grid;background:#030810;box-shadow:inset 0 0 0 1px var(--ln);border-radius:4px;overflow-x:auto}
.ln{display:flex;gap:10px;align-items:center;padding:9px 11px;min-width:max-content;width:100%;border-bottom:1px solid #0b1626;transition:.14s}
.ln:last-child{border-bottom:0}
.ln .no{flex:none;width:17px;color:#3f5party;font:600 10.5px 'JetBrains Mono',monospace;color:#44577b}
.ln code{font:600 12.5px 'JetBrains Mono',monospace;white-space:pre}
.ln.ok{background:rgba(182,255,59,.16)}
.ln.no2{background:rgba(255,74,92,.18)}

/* order + fill chips */
.slot{min-height:80px;padding:10px;display:grid;gap:6px;background:#030810;box-shadow:inset 0 0 0 1px var(--acc);border-radius:4px;align-content:start}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 12px;background:var(--p2);box-shadow:inset 0 0 0 1px var(--ln);border-radius:3px;
 font:600 12.5px 'JetBrains Mono',monospace;overflow-wrap:anywhere;max-width:100%;transition:.12s}
.chip:active{transform:scale(.95)}
.slot .chip{background:#0c1a30;display:flex;gap:8px;align-items:center}
.slot .chip .n2{color:var(--dim);font-size:11px;flex:none}
.fillcode{margin:0;padding:13px;background:#030810;box-shadow:inset 0 0 0 1px var(--ln);border-radius:4px;
 font:600 12.5px/2.1 'JetBrains Mono',monospace;overflow-x:auto;white-space:pre;color:#cfe0ff}
.blank{display:inline-block;min-width:76px;padding:2px 8px;text-align:center;border-radius:3px;
 background:#0c1a30;box-shadow:inset 0 0 0 1px var(--ln2);color:var(--dim);font:600 12.5px 'JetBrains Mono',monospace}
.blank.sel{box-shadow:inset 0 0 0 2px var(--acc);background:color-mix(in srgb,var(--acc) 15%,#0c1a30)}
.blank.has{color:var(--cy);background:#0c1a30}
.blank.ok{box-shadow:inset 0 0 0 2px var(--lm);color:var(--lm)}
.blank.no{box-shadow:inset 0 0 0 2px var(--rd);color:var(--rd)}

/* match */
.mt{display:grid;gap:8px}
.mrow{display:flex;gap:8px;align-items:stretch}
.mleft{flex:none;width:38%;padding:11px;background:var(--p2);box-shadow:inset 0 0 0 1px var(--ln);border-radius:3px;
 font:600 13px 'Chakra Petch',sans-serif;display:flex;align-items:center}
.mleft.sel{box-shadow:inset 0 0 0 2px var(--acc)}
.mdrop{flex:1;min-width:0;padding:11px;background:#030810;box-shadow:inset 0 0 0 1px var(--ln2);border-radius:3px;
 font-size:12.5px;color:var(--dim);display:flex;align-items:center;overflow-wrap:anywhere}
.mdrop.has{color:var(--tx);background:#0c1a30}
.mdrop.ok{box-shadow:inset 0 0 0 2px var(--lm)}
.mdrop.no{box-shadow:inset 0 0 0 2px var(--rd)}

/* feedback */
.fb{padding:14px;display:grid;gap:9px;animation:in .3s both;border-radius:0 4px 4px 0}
.fb.good{background:rgba(182,255,59,.08);border-left:3px solid var(--lm)}
.fb.bad{background:rgba(255,74,92,.08);border-left:3px solid var(--rd)}
.fb b{font:700 17px 'Chakra Petch',sans-serif}
.fb.good b{color:var(--lm)}.fb.bad b{color:var(--rd)}
.fb p{font-size:14px}
.hintbox{padding:13px 14px;background:rgba(157,123,255,.1);border-left:3px solid var(--vi);border-radius:0 4px 4px 0;animation:in .25s both;font-size:14px}
.hintbox b{display:block;font:700 10.5px 'Chakra Petch',sans-serif;letter-spacing:.17em;color:var(--vi);margin-bottom:3px}
.hintbtn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:4px;

<script>
var W1 = {
 "id": 1,
 "name": "Dispatch Floor",
 "sub": "Apex basics",
 "brief": "Read and write basic Apex: types, logic, loops, collections and errors.",
 "intro": [
  {
   "w": "sys",
   "x": "NIGHT SHIFT  02:14  CONTROL ROOM 7"
  },
  {
   "w": "nova",
   "x": "Welcome to the Grid. I am NOVA. I keep this control room running."
  },
  {
   "w": "nova",
   "x": "Every night we send hundreds of jobs across the city. All of it runs on Apex code."
  },
  {
   "w": "dex",
   "x": "I am Dex, lead developer. Tonight you take the dispatch desk."
  },
  {
   "w": "ph",
   "x": "jobs... scrambled... nobody knows where to go..."
  },
  {
   "w": "nova",
   "x": "That is the Phantom. A bug ghost. It lives inside careless code."
  },
  {
   "w": "dex",
   "x": "You beat it with clean Apex. I will teach you one idea at a time."
  }
 ],
 "missions": [
  {
   "id": "w1m1",
   "t": "Name the boxes",
   "goal": "Store the night shift numbers in the right types.",
   "real": "Every Salesforce field has a type. Apex variables must match it.",
   "story": [
    {
     "w": "nova",
     "x": "The board is blank. Give me the shift numbers, and give each one the right type."
    }
   ],
   "teach": {
    "h": "A variable is a named box",
    "pts": [
     "A variable holds one value and has a type.",
     "String is text. Integer is a whole number. Decimal is a number with decimal places.",
     "Boolean is true or false. Date is a day. Id is a record key.",
     "Money is always Decimal. Never use Double for money."
    ],
    "code": "String tech = 'Asha';\nInteger jobs = 4;\nDecimal fee = 32.50;\nBoolean urgent = false;",
    "rule": "Pick the type that fits the data. Money is Decimal."
   },
   "task": {
    "type": "fill",
    "q": "Fill the blanks with the right types.",
    "code": "{} techName = 'Asha';\n{} openJobs = 4;\n{} callOutFee = 32.50;",
    "pool": [
     "String",
     "Integer",
     "Decimal",
     "Boolean",
     "Date"
    ],
    "a": [
     "String",
     "Integer",
     "Decimal"
    ]
   },
   "hints": [
    "NOVA: \"Look at each value. Is it text, a whole number, or money?\"",
    "Field note: text is String, a whole number is Integer, money is Decimal.",
    "The answers are String, Integer and Decimal. 'Asha' is text, 4 is a whole number, and 32.50 is money."
   ],
   "run": [
    "Asha",
    "4",
    "32.50"
   ],
   "why": "The type must match the value. A Decimal keeps the exact cents, so it is the safe choice for money.",
   "alts": [
    {
     "type": "choose",
     "lvl": 3,
     "q": "A nightly total of 50,000 job fees is out by a few cents. Fee__c is a Currency field. What do you change?",
     "code": "Double sum = 0;\nfor (Job__c j : jobs) {\n  sum += j.Fee__c;\n}",
     "mono": false,
     "o": [
      "Declare the running total as Decimal",
      "Round each fee with Math.round first",
      "Keep Double and show 2 decimal places",
      "Change Fee__c to a Number field"
     ],
     "a": 0,
     "why": "A Currency field arrives in Apex as Decimal, which keeps exact cents. Double is binary floating point, so every add can lose a tiny amount. Rounding each fee with Math.round throws the cents away instead of keeping them.",
     "hints": [
      "NOVA: \"The field is fine. Look at the box you add it into.\"",
      "Field note: money must stay Decimal from the field all the way to the total.",
      "Declare the total as Decimal. Double is floating point, so it drifts over 50,000 adds."
     ]
    }
   ]
  },
  {
   "id": "w1m2",
   "t": "Clean the labels",
   "goal": "Tidy a job label and set a due date.",
   "real": "You use String and Date methods on record fields every day.",
   "story": [
    {
     "w": "dex",
     "x": "The labels came in messy. Clean them up before the board reads them."
    }
   ],
   "teach": {
    "h": "Text and days",
    "pts": [
     "Text goes in single quotes.",
     "Useful methods: trim(), toUpperCase(), contains(), length().",
     "A String method never changes the original. It gives back a new String.",
     "Date.today() is the day. Datetime.now() is the day and the time. addDays() moves a date."
    ],
    "code": "String label = '  night run  ';\nSystem.debug(label.trim());\nDate due = Date.today().addDays(3);",
    "rule": "String methods return a new value. Assign the result or it is lost."
   },
   "task": {
    "type": "fix",
    "q": "One line does nothing useful. Tap it.",
    "code": "String label = '  night run  ';\nlabel.trim();\nlabel = label.toUpperCase();\nSystem.debug(label);",
    "a": 1
   },
   "hints": [
    "DEX: \"One of those lines throws its own result away.\"",
    "Field note: trim() gives back a new String. It does not change the old one.",
    "Line 2 is the problem. It should be label = label.trim(); so the clean text is kept."
   ],
   "run": [
    "NIGHT RUN"
   ],
   "why": "trim() returns a new String. Without assigning it back, the spaces stay.",
   "alts": [
    {
     "type": "fix",
     "lvl": 3,
     "q": "The dedupe key still has spaces for all 5,000 jobs. Tap the line that does nothing.",
     "code": "for (Job__c j : jobs) {\n  String k = j.Town__c;\n  k.trim().toUpperCase();\n  byTown.put(k, j);\n}",
     "a": 2,
     "why": "A chain of String methods still returns a new String. Nothing was assigned, so k keeps the original text and every key is wrong.",
     "hints": [
      "DEX: \"Two methods ran. Where did the result go?\"",
      "Field note: String methods never change the original. You must assign the result.",
      "Line 3 is the problem. It must be k = k.trim().toUpperCase(); or the clean key is thrown away."
     ]
    }
   ]
  },
  {
   "id": "w1m3",
   "t": "Call the shot",
   "goal": "Decide if a job is overtime.",
   "real": "Validation rules, flows and triggers all choose a path the same way.",
   "story": [
    {
     "w": "nova",
     "x": "A shift ran long. Decide if it counts as overtime before payroll sees it."
    }
   ],
   "teach": {
    "h": "if, else and the short form",
    "pts": [
     "if runs code only when a check is true. else runs the other path.",
     "&& means AND. || means OR. ! means NOT.",
     "A ternary is a short if/else: check ? valueIfTrue : valueIfFalse.",
     "Careful: == on two Strings ignores upper and lower case. Use equals() for an exact match."
    ],
    "code": "Integer hours = 9;\nString level = hours > 8\n  ? 'Overtime'\n  : 'Normal';",
    "rule": "In Apex, 'Done' == 'done' is true. == on text ignores case."
   },
   "task": {
    "type": "fix",
    "q": "This check never works the way it looks. Tap the broken line.",
    "code": "String status = 'Open';\nif (status = 'Closed') {\n  System.debug('Already closed');\n}",
    "a": 1
   },
   "hints": [
    "NOVA: \"Count the equals signs.\"",
    "Field note: one = puts a value in. Two == compares two values.",
    "Line 2 is wrong. It must be if (status == 'Closed') to compare instead of assign."
   ],
   "run": [
    "nothing printed: status is Open, not Closed"
   ],
   "why": "A single = assigns. A double == compares. Apex will not even compile the assignment here.",
   "alts": [
    {
     "type": "choose",
     "lvl": 3,
     "q": "The if test treats \"closed\" and \"Closed\" as the same job, yet the count report shows two separate rows. Why?",
     "code": "if (j.Status__c == 'Closed') { }\ncounts.put(j.Status__c, n + 1);",
     "mono": false,
     "o": [
      "Map keys of type String are case-sensitive, but == on String is not",
      "The second put overwrote the first, so one row is stale",
      "equals() was used, and equals() ignores case",
      "A Set would split them, but a Map should not"
     ],
     "a": 0,
     "why": "String comparison with == is case-insensitive, so the if test matched both. Map keys of type String are case-sensitive, so Closed and closed are two different keys. Neither put overwrote the other.",
     "hints": [
      "NOVA: \"The if test and the Map do not agree about case.\"",
      "Field note: == on String ignores case. Map keys of type String do not.",
      "Map keys of type String are case-sensitive while == is not, so the same records land in two buckets. Normalise the key before you put it."
     ]
    }
   ]
  },
  {
   "id": "w1m4",
   "t": "Walk the route",
   "goal": "Add up the hours on tonight's route.",
   "real": "A trigger always gets a list of records, so you loop over them.",
   "story": [
    {
     "w": "dex",
     "x": "Six stops tonight. Add the hours without typing each one."
    }
   ],
   "teach": {
    "h": "A loop repeats work",
    "pts": [
     "A loop runs the same code for every item in a list.",
     "for-each is the easiest form: for (Integer h : hours).",
     "continue skips to the next item. break stops the loop early.",
     "Never add or remove items from a list while you loop over it."
    ],
    "code": "Integer total = 0;\nfor (Integer h : hours) {\n  total += h;\n}",
    "rule": "Prefer for-each. You cannot get the index wrong."
   },
   "task": {
    "type": "order",
    "q": "Build a loop that adds every hour. Tap the lines in order.",
    "p": [
     "Integer total = 0;",
     "for (Integer h : hours) {",
     "  total += h;",
     "}",
     "System.debug(total);"
    ]
   },
   "hints": [
    "DEX: \"Start the total at zero before you count anything.\"",
    "Field note: declare the total, open the loop, add inside it, close it, then print.",
    "The order is: Integer total = 0; then the for line, then total += h; then the closing brace, then the debug."
   ],
   "run": [
    "14"
   ],
   "why": "The total must exist before the loop, and the printing happens after the loop has finished.",
   "alts": [
    {
     "type": "choose",
     "lvl": 3,
     "q": "The loop runs, the update saves, and nothing changed. Why?",
     "code": "for (Job__c j : jobs) {\n  j = new Job__c(Status__c = 'Open');\n}\nupdate jobs;",
     "mono": false,
     "o": [
      "j is its own reference, so a new object does not replace the item in the list",
      "for-each hands you a read-only copy of each record",
      "The new Job__c has no Id, so update skipped it",
      "update needs a list you built yourself with add()"
     ],
     "a": 0,
     "why": "The loop variable points at the record in the list, so setting one field through it would have worked. Assigning a whole new object only moves the pointer, and the list still holds the old records.",
     "hints": [
      "DEX: \"Setting one field would have worked. Replacing the whole object did not.\"",
      "Field note: the loop variable is a reference to the item, not the slot in the list.",
      "j is only a reference. A new Job__c assigned to j never enters the list, so update saved the unchanged records."
     ]
    }
   ]
  },
  {
   "id": "w1m5",
   "t": "Stack the board",
   "goal": "Keep the stops in order.",
   "real": "A SOQL query gives you a List, and a trigger gives you Trigger.new as a List.",
   "story": [
    {
     "w": "nova",
     "x": "Route order matters. Stop three must stay stop three."
    }
   ],
   "teach": {
    "h": "List keeps order",
    "pts": [
     "A List is ordered and can hold the same value twice.",
     "It counts from 0, so the first item is myList[0].",
     "add() puts an item at the end. size() tells you how many there are.",
     "Reading past the end throws a ListException."
    ],
    "code": "List<String> stops =\n  new List<String>{'A','B'};\nstops.add('C');\nSystem.debug(stops[0]);",
    "rule": "A List starts at index 0. The last index is size() - 1."
   },
   "task": {
    "type": "choose",
    "q": "What does this print?",
    "code": "List<String> stops =\n  new List<String>{'A','B'};\nstops.add('C');\nSystem.debug(stops[2]);",
    "mono": false,
    "o": [
     "C",
     "B",
     "A",
     "A ListException"
    ],
    "a": 0
   },
   "hints": [
    "NOVA: \"Count the slots from zero, not from one.\"",
    "Field note: index 0 is 'A', index 1 is 'B', index 2 is the item that was added.",
    "The answer is C. add() put 'C' at the end, which is index 2."
   ],
   "run": [
    "C"
   ],
   "why": "Index 0 is the first item, so index 2 is the third one, which is the value add() appended.",
   "alts": [
    {
     "type": "choose",
     "lvl": 3,
     "q": "You keep a before snapshot so you can compare. The compare always says nothing changed. Why?",
     "code": "List<Job__c> before =\n  new List<Job__c>(jobs);\nfor (Job__c j : jobs) {\n  j.Status__c = 'Closed';\n}",
     "mono": false,
     "o": [
      "Both lists hold the same record objects, so both see the change",
      "new List<Job__c>(jobs) is empty until you call addAll",
      "The copy is in a different order, so the compare lines up wrongly",
      "The loop never saved, so before is right and jobs is wrong"
     ],
     "a": 0,
     "why": "A new List copies the references, not the records. A field set through one list is visible through the other. A real snapshot needs a copy of the field values, or a second query.",
     "hints": [
      "NOVA: \"You copied the list. Did you copy the records?\"",
      "Field note: a List of sObjects holds references, so copying the List copies the references.",
      "Both lists point at the same record objects, so the change shows in both. A snapshot must copy the field values."
     ]
    }
   ]
  },
  {
   "id": "w1m6",
   "t": "Drop the twins",
   "goal": "Remove duplicate techs and look up their hours fast.",
   "real": "Bulk Apex collects Ids in a Set and looks records up in a Map.",
   "story": [
    {
     "w": "ph",
     "x": "two of everyone... double the jobs... nobody notices..."
    },
    {
     "w": "dex",

   "teach": {
    "h": "An error strategy",
    "pts": [
     "Declare your own exception in one line: public class JobException extends Exception {}",
     "The name must end in Exception, and the class inherits the constructors, so you can throw it with a message, a cause, or both.",
     "Never leave a catch block empty. A dropped error costs days later.",
     "Catch only what you can handle. Log the rest and rethrow, or let it reach the user.",
     "Log what you will actually need: getTypeName(), getMessage(), getStackTraceString() and the record Id."
    ],
    "code": "try {\n  JobService.close(jobs);\n} catch (DmlException e) {\n  Logger.save(e.getTypeName(),\n    e.getMessage(),\n    e.getStackTraceString());\n  throw new JobException(\n    'Could not close jobs', e);\n}",
    "rule": "An empty catch block is a lie. Log it or rethrow it."
   },

    "q": "One line here makes a real failure invisible. Tap it.",

    "a": 3

    "NOVA: the catch did catch something. Then what happened to it?",
    "Field note: a catch that neither logs nor rethrows ends the problem silently, and the caller is told the work succeeded.",

     "Database.queryWithBinds takes the query, a Map of bind names to values, and an AccessLevel.",

    "h": "Callout limits and the DML rule",
    "pts": [
     "One transaction can make at most 100 callouts.",
     "The default wait is 10 seconds per callout, you can set up to 120 seconds, and all callouts together may not exceed 120 seconds in one transaction.",

     "Three ways out: do the callout before any DML, roll the DML back to a savepoint, or move the callout into asynchronous Apex.",

function bDone(w){return !!(S.b[w]&&S.b[w].done)}
function steps(w){var W0=W(w);return W0.missions.map(function(m){return {k:'m',m:m}}).concat([{k:'b'}])}
function stepDone(w,s){return s.k==='m'?mDone(s.m.id):bDone(w)}
function unlockedAt(w,i){if(i===0)return true;var ss=steps(w);return stepDone(w,ss[i-1])}
function nextStep(w){var ss=steps(w);for(var i=0;i<ss.length;i++)if(!stepDone(w,ss[i]))return i;return -1}
function worldDone(w){return nextStep(w)<0}
function worldOpen(w){return w===1||worldDone(w-1)}
function worldPct(w){var ss=steps(w),d=0;ss.forEach(function(s){if(stepDone(w,s))d++});return Math.round(d/ss.length*100)}
function totalStars(){var n=0;BUILT.forEach(function(W0){W0.missions.forEach(function(m){n+=starsFor(mPts(m.id))})});return n}
function starsFor(p){return p>=MAXP?3:p>=20?2:p>0?1:0}
function missionsDone(){var n=0;BUILT.forEach(function(W0){W0.missions.forEach(function(m){if(mDone(m.id))n++})});return n}
function missionsTotal(){var n=0;BUILT.forEach(function(W0){n+=W0.missions.length});return n}

/* ---------- badges ---------- */
function worldsCleared(){var n=0;for(var i=1;i<=BUILT.length;i++)if(worldDone(i))n++;return n}
function noHintCount(){var n=0;BUILT.forEach(function(W0){W0.missions.forEach(function(m){if(mDone(m.id)&&!(S.m[m.id].hints))n++})});return n}
var BADGES=[
 {id:'first',n:'First Light',d:'Finish 1 mission',f:function(){return missionsDone()>=1}},
 {id:'ten',n:'Steady Hand',d:'Finish 10 missions',f:function(){return missionsDone()>=10}},

 {id:'allm',n:'Completionist',d:'Every mission done',f:function(){return missionsDone()>=missionsTotal()}},
 {id:'w1',n:'Floor Clear',d:'Clear World 1',f:function(){return worldDone(1)}},
 {id:'w3',n:'Three Down',d:'Clear 3 worlds',f:function(){return worldsCleared()>=3}},
 {id:'w6',n:'Half the Grid',d:'Clear 6 worlds',f:function(){return worldsCleared()>=6}},

 {id:'solo',n:'No Help',d:'10 missions, no hints',f:function(){return noHintCount()>=10}},
 {id:'solo2',n:'Lone Wolf',d:'40 missions, no hints',f:function(){return noHintCount()>=40}},
 {id:'perfect',n:'Flawless',d:'Full marks on a mission',f:function(){var ok=false;BUILT.forEach(function(W0){W0.missions.forEach(function(m){if(mPts(m.id)>=MAXP)ok=true})});return ok}},

var DB=null,UID=null,OWNER=false,UNS=null,ready=false,syncT=0,busy=false,lastSent='';
function cloudSync(){if(!ready||!DB||!UID||!S.nick)return;clearTimeout(syncT);syncT=setTimeout(doSync,1600)}
function doSync(){
 if(busy){syncT=setTimeout(doSync,1600);return}
 var blob=JSON.stringify(S);if(blob===lastSent)return;
 busy=true;
 var row={nick:S.nick,xp:S.xp,done:missionsDone(),total:missionsTotal(),
  stars:totalStars(),streak:S.streak,badges:S.badges.length,seen:new Date().toISOString()};

  .then(function(){return DB.doc('players/'+UID).set(Object.assign({},row,
   {w:S.w,next:nextLabel(),email:S.email||'',w1clear:worldDone(1)}))})
  .then(function(){return DB.doc('data/users/'+UID+'/profile').set({s:blob})})
  .then(function(){lastSent=blob;busy=false},function(){busy=false});
}
function sendFeedback(){
 if(!DB||!UID)return; // saved locally only — this view has no signed-in cloud
 DB.doc('feedback/'+UID).set({nick:S.nick,stars:S.fb.stars,text:S.fb.text,xp:S.xp,w:S.w,
  ts:new Date().toISOString()}).catch(function(){})

function initCloud(){
 if(!window.claude||!window.claude.use)return;
 Promise.all([window.claude.use('user'),window.claude.use('db')]).then(function(r){
  UNS=r[0];DB=r[1];if(!UNS||!DB)return;
  return UNS.id().then(function(id){UID=id;return UNS.isOwner()}).then(function(o){
   OWNER=!!o;if(!UID)return;
   return DB.doc('data/users/'+UID+'/profile').get().then(function(sn){
    if(sn.exists){try{
     var o2=JSON.parse(sn.data().s);
     if(o2&&typeof o2.xp==='number'&&o2.xp>S.xp){
      S=Object.assign(fresh(),o2);
      try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
      if(CUR==='title')screenTitle();
     }
    }catch(e){}}
    ready=true;lastSent='';cloudSync();
   });
  });
 }).catch(function(){});
}

function renderTask(host,T,cb){
 var locked=false,sent=false;
 function lock(){locked=true}
 function done(ok,anchor){if(sent)return;if(ok)sent=true;cb(ok,anchor)}
 var body='';
 if(T.type==='choose'){
  var opts=shuffle(T.o.map(function(t,i){return {t:t,i:i}}));

   opts.map(function(o,k){return '<button class="opt'+(T.mono?' mono':'')+'" data-i="'+o.i+'">'+
    '<span class="l">'+'ABCDE'[k]+'</span><span>'+(T.mono?hl(o.t):esc(o.t))+'</span></button>'}).join('')+'</div>';
  host.innerHTML=body;
  $('#qa',host).onclick=function(e){
   var b=e.target.closest('.opt');if(!b||locked)return;
   var ok=+b.dataset.i===T.a;
   b.classList.add(ok?'ok':'no');
   if(ok){lock();$$('.opt',host).forEach(function(x){if(x!==b)x.classList.add('dim')})}
   done(ok,b);
   if(!ok)setTimeout(function(){b.classList.remove('no')},1300);
  };
 }else if(T.type==='fix'){
  var lines=T.code.split('\n');
  host.innerHTML='<div class="bug" id="qa">'+lines.map(function(l,i){
   return '<button class="ln" data-i="'+i+'"><span class="no">'+(i+1)+'</span><code>'+hl(l)+'</code></button>'}).join('')+'</div>';
  $('#qa',host).onclick=function(e){
   var b=e.target.closest('.ln');if(!b||locked)return;
   var ok=+b.dataset.i===T.a;
   b.classList.add(ok?'ok':'no2');
   if(ok)lock();
   else setTimeout(function(){b.classList.remove('no2')},1200);
   done(ok,b);
  };
 }else if(T.type==='order'){
  var items=shuffle(T.p.map(function(t,i){return {t:t,i:i}})),ans=[];
  host.innerHTML='<div class="slot" id="sl"></div><div class="pool" id="pl"></div>'+
   '<div class="row" style="gap:8px"><button class="btn gh sm2" id="clr" style="flex:0 0 104px">Start over</button>'+
   '<button class="btn alt" id="ck" disabled>Check my answer</button></div>';
  var sl=$('#sl',host),pl=$('#pl',host),ck=$('#ck',host);
  $('#clr',host).onclick=function(){if(locked)return;SFX.move();ans=[];draw()};
  function draw(){
   sl.innerHTML=ans.length?ans.map(function(a,k){
    return '<button class="chip" data-k="'+k+'"><span class="n2">'+(k+1)+'</span>'+hl(a.t)+'</button>'}).join('')
    :'<span class="mu sm">Tap the lines below, in the right order</span>';
   pl.innerHTML=items.filter(function(x){return ans.indexOf(x)<0}).map(function(x){
    return '<button class="chip" data-i="'+x.i+'">'+hl(x.t)+'</button>'}).join('');
   ck.disabled=locked||ans.length!==items.length;
  }
  pl.onclick=function(e){var b=e.target.closest('.chip');if(!b||locked)return;SFX.move();
   ans.push(items.filter(function(x){return x.i===+b.dataset.i})[0]);draw()};
  sl.onclick=function(e){var b=e.target.closest('.chip');if(!b||locked)return;SFX.move();ans.splice(+b.dataset.k,1);draw()};
  ck.onclick=function(){
   if(locked)return;
   var ok=ans.every(function(a,k){return a.i===k});
   if(ok){lock();ck.disabled=true}
   else{var first=-1;ans.forEach(function(a,k){if(first<0&&a.i!==k)first=k});
    var chips=$$('.chip',sl);if(chips[first])chips[first].style.boxShadow='inset 0 0 0 2px var(--rd)';
    setTimeout(function(){if(chips[first])chips[first].style.boxShadow=''},1300)}
   done(ok,ck);
  };
  draw();
 }else if(T.type==='fill'){
  var parts=T.code.split('{}'),pool=shuffle(T.pool.slice()),filled=[],sel=0;
  for(var z=0;z<T.a.length;z++)filled.push(null);
  host.innerHTML='<pre class="fillcode" id="fc"></pre><div class="pool" id="pl"></div>'+
   '<div class="row" style="gap:8px"><button class="btn gh sm2" id="clr" style="flex:0 0 104px">Start over</button>'+
   '<button class="btn alt" id="ck" disabled>Check my answer</button></div>';
  var fc=$('#fc',host),pl2=$('#pl',host),ck2=$('#ck',host);
  $('#clr',host).onclick=function(){if(locked)return;SFX.move();
   for(var z2=0;z2<filled.length;z2++)filled[z2]=null;sel=0;drawF()};
  function drawF(){
   var h='';
   parts.forEach(function(p,i){
    h+=hl(p);
    if(i<filled.length)h+='<button class="blank'+(filled[i]?' has':'')+(sel===i?' sel':'')+'" data-b="'+i+'">'+
     (filled[i]?esc(filled[i]):'?')+'</button>';
   });
   fc.innerHTML=h;
   pl2.innerHTML=pool.filter(function(t){return filled.indexOf(t)<0}).map(function(t){
    return '<button class="chip" data-t="'+esc(t)+'">'+hl(t)+'</button>'}).join('');
   ck2.disabled=locked||filled.some(function(f){return !f});
  }
  fc.onclick=function(e){var b=e.target.closest('.blank');if(!b||locked)return;
   var i=+b.dataset.b;if(filled[i]){filled[i]=null;SFX.move()}sel=i;drawF()};
  pl2.onclick=function(e){
   var b=e.target.closest('.chip');if(!b||locked)return;SFX.move();
   var t=b.dataset.t,i=sel;
   if(i<0||i>=filled.length)i=0;
   filled[i]=t;
   var nx=filled.indexOf(null);sel=nx<0?i:nx;drawF();
  };
  ck2.onclick=function(){
   if(locked)return;
   var ok=filled.every(function(f,i){return f===T.a[i]});
   $$('.blank',fc).forEach(function(b,i){b.classList.add(filled[i]===T.a[i]?'ok':'no')});
   if(ok){lock();ck2.disabled=true}
   else setTimeout(function(){$$('.blank',fc).forEach(function(b){b.classList.remove('ok','no')})},1400);
   done(ok,ck2);
  };
  drawF();
 }else if(T.type==='match'){
  var rights=shuffle(T.pairs.map(function(p,i){return {t:p[1],i:i}})),put=[],selL=0;
  T.pairs.forEach(function(){put.push(null)});
  host.innerHTML='<div class="mt" id="mt"></div><div class="pool" id="pl"></div>'+
   '<div class="row" style="gap:8px"><button class="btn gh sm2" id="clr" style="flex:0 0 104px">Start over</button>'+
   '<button class="btn alt" id="ck" disabled>Check my answer</button></div>';
  var mt=$('#mt',host),pl3=$('#pl',host),ck3=$('#ck',host);
  $('#clr',host).onclick=function(){if(locked)return;SFX.move();
   for(var z3=0;z3<put.length;z3++)put[z3]=null;selL=0;drawM()};
  function drawM(){
   mt.innerHTML=T.pairs.map(function(p,i){
    return '<div class="mrow"><button class="mleft'+(selL===i?' sel':'')+'" data-l="'+i+'">'+esc(p[0])+'</button>'+
     '<button class="mdrop'+(put[i]!=null?' has':'')+'" data-d="'+i+'">'+(put[i]!=null?esc(rights[put[i]].t):'tap a match below')+'</button></div>'}).join('');
   pl3.innerHTML=rights.map(function(r,k){return put.indexOf(k)>-1?'':'<button class="chip" data-r="'+k+'">'+esc(r.t)+'</button>'}).join('');
   ck3.disabled=locked||put.some(function(p){return p==null});
  }
  mt.onclick=function(e){
   if(locked)return;
   var l=e.target.closest('.mleft'),d=e.target.closest('.mdrop');
   if(l){selL=+l.dataset.l;SFX.move();drawM()}
   else if(d){var i=+d.dataset.d;if(put[i]!=null){put[i]=null;SFX.move()}selL=i;drawM()}
  };
  pl3.onclick=function(e){
   var b=e.target.closest('.chip');if(!b||locked)return;SFX.move();
   put[selL]=+b.dataset.r;
   var nx=put.indexOf(null);selL=nx<0?selL:nx;drawM();
  };
  ck3.onclick=function(){
   if(locked)return;
   var ok=put.every(function(p,i){return rights[p].i===i});
   $$('.mdrop',mt).forEach(function(d,i){d.classList.add(rights[put[i]].i===i?'ok':'no')});
   if(ok){lock();ck3.disabled=true}
   else setTimeout(function(){$$('.mdrop',mt).forEach(function(d){d.classList.remove('ok','no')})},1500);
   done(ok,ck3);
  };
  drawM();
 }
}

  hbox.lastElementChild.scrollIntoView({block:'nearest',behavior:'smooth'});
 };
 if(!S.coach){

 }

 });

var EXAMN=50;

 var N=Math.min(EXAMN,pool.length);

 CUR='exam';chrome(false);musicMode('tense');
 var i=0,right=0,total=qs.length;

 copy:function(){
  var t=$('#sc');t.select();
  try{
   if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(t.value).then(function(){toast('Copied')},function(){toast('Select the text and copy it yourself')});
   else toast('Select the text and copy it yourself');
  }catch(e){toast('Select the text and copy it yourself')}
 },
 load:function(){

   var v=$('#ld').value.trim();

   if(!o||typeof o!=='object'||typeof o.xp!=='number')throw 0;
   S=Object.assign(fresh(),o);save();$('#sheet').hidden=true;
   toast('Progress restored');TAB='play';goTab('play');
  }catch(e){toast('That code does not look right')}
 },
 fbstar:function(t){
  S.fb.stars=+t.dataset.k;save();

 },
 fbsend:function(){

 },
 share:function(){
  var r=rank(S.xp);
  var txt='I am a '+r.name+' with '+S.xp+' XP in Dispatch Zero — a free game that teaches real Salesforce Apex code. '+
   missionsDone()+'/'+missionsTotal()+' missions done. Try it: '+location.href;
  var done=function(){toast('Copied — paste it on LinkedIn or WhatsApp')};
  var showText=function(){toast(txt,9000)};
  try{
   if(navigator.share){
    navigator.share({title:'Dispatch Zero',text:txt}).catch(function(){
     try{
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,showText);
      else showText();
     }catch(e){showText()}
    });
   }else if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done,showText);
   }else showText();
  }catch(e){showText()}
 },
 reset:function(){rst=1;drawDanger()},
 keep:function(){rst=0;drawDanger()},
 erase:function(){

  $('#sheet').hidden=true;musicStop();toast('Progress erased');screenTitle();
 }

function enter(){
 if(!S.seen){S.seen=true;save();playStory(W1.intro,function(){TAB='play';goTab('play')})}
 else{TAB='play';goTab('play')}
}
/* Dispatch: iOS webviews sometimes swallow the synthetic click, so a guarded
   touchend fires the same action and cancels the click that would follow. */
var ACTED=false;
var lastEl=null,lastAt=0,QUIET=['step','tip','gow','nope','nope2','soon'];
function act(el){return (el&&el.closest)?el.closest('[data-act]'):null}
function fire(t,e){
 if(!t||t.disabled)return;
 var f=ACT[t.dataset.act];if(!f)return;
 var now=Date.now();
 if(t===lastEl&&now-lastAt<320)return;
 lastEl=t;lastAt=now;ACTED=true;
 audioInit();musicStart();
 if(QUIET.indexOf(t.dataset.act)<0)SFX.tap();
 try{f(t,e)}catch(err){toast('Something broke: '+((err&&err.message)||err),7000)}
}
var TS=null;
document.addEventListener('touchstart',function(e){
 audioInit();
 var t=act(e.target),p=e.touches&&e.touches[0];
 TS=(t&&p&&ACT[t.dataset.act])?{t:t,x:p.clientX,y:p.clientY,at:Date.now()}:null;
},{passive:true});
document.addEventListener('touchend',function(e){
 var s=TS;TS=null;if(!s)return;
 var p=e.changedTouches&&e.changedTouches[0];if(!p)return;
 if(Math.abs(p.clientX-s.x)>14||Math.abs(p.clientY-s.y)>14)return;
 if(Date.now()-s.at>900)return;
 if(act(e.target)!==s.t)return;
 if(e.cancelable)e.preventDefault();
 fire(s.t,e);
},{passive:false});
document.addEventListener('touchcancel',function(){TS=null},{passive:true});
document.addEventListener('click',function(e){fire(act(e.target),e)});
window.addEventListener('error',function(e){
 try{toast('Something broke: '+((e&&e.message)||'unknown'),7000)}catch(x){}
});
$('#sheet').addEventListener('click',function(e){if(e.target.id==='sheet'){$('#sheet').hidden=true;rst=0}});
addEventListener('resize',function(){if(!$('#tour').hidden)drawTour()});

function inAppBrowserName(){
 var ua=navigator.userAgent||'';
 if(/FBAN|FBAV|FB_IAB|FBIOS/.test(ua))return 'Facebook';
 if(/Instagram/.test(ua))return 'Instagram';
 if(/\bWhatsApp/.test(ua))return 'WhatsApp';
 if(/LinkedInApp|LIApp/.test(ua))return 'LinkedIn';
 if(/\bLine\//.test(ua))return 'Line';
 if(/MicroMessenger/.test(ua))return 'WeChat';
 if(/TikTok|BytedanceWebview|musical_ly/.test(ua))return 'TikTok';
 return ''
}
function inAppBanner(){
 var name=inAppBrowserName();
 if(!name)return;
 try{if(sessionStorage.getItem('iabX'))return}catch(e){}
 var d=document.createElement('div');
 d.id='iab';
 d.innerHTML='<span>Opened inside '+name+' — for the best experience, tap <b>⋯</b> and choose <b>Open in Browser</b>.</span>'+
  '<button data-act="iabx" aria-label="Dismiss">✕</button>';
 document.body.insertBefore(d,document.body.firstChild);
}
screenTitle();
initCloud();
inAppBanner();
})();
